[package]
name = "nixus"
version = "0.1.0"
edition = "2024"

[dependencies]
# cli argument parser
clap = { version = "4.6.7", features = ["derive"] }
# json parser
serde_json = "1.0"
# derive macros for serde_json
serde = { version = "1.0", features = ["derive"] }

#--dependencies for test--

# temporary directory crate
tempfile = "3.0"
# jinja2 template engine
minijinja = "2.24.0"

